<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Curriculum Vitae profesional - Business Intelligence, Datos y Automatización">
  <title>Juan de Dios Castro Nuñez | Business Intelligence & Data</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="hero">
    <div class="container reveal">
      <p class="eyebrow">Curriculum Vitae</p>
      <h1 id="profile-name">Juan de Dios Castro Nuñez</h1>
      <h2 id="profile-title">Business Intelligence | Data & Automation</h2>
      <a href="#about" class="btn">Conocer perfil</a>
    </div>
  </header>

  <main>
    <section id="about" class="section">
      <div class="container reveal">
        <p class="eyebrow">Perfil profesional</p>
        <h2>Acerca de</h2>
        <div id="profile-summary" class="summary"></div>
      </div>
    </section>

    <section id="skills" class="section section-alt">
      <div class="container reveal">
        <p class="eyebrow">Stack</p>
        <h2>Tecnologías y especialidades</h2>
        <div id="skills-list" class="chips"></div>
      </div>
    </section>

    <section id="experience" class="section">
      <div class="container reveal">
        <p class="eyebrow">Trayectoria</p>
        <h2>Experiencia profesional</h2>
        <div id="experience-list" class="timeline"></div>
      </div>
    </section>

    <section id="education" class="section section-alt">
      <div class="container reveal">
        <p class="eyebrow">Formación</p>
        <h2>Educación</h2>
        <div id="education-list" class="timeline"></div>
      </div>
    </section>

    <section id="extras" class="section">
      <div class="container reveal">
        <p class="eyebrow">Perfil</p>
        <h2>Idiomas y habilidades</h2>
        <div id="extras-list" class="chips"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">CV profesional · <span id="year"></span></div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
